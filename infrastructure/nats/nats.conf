# Local development NATS with JetStream. Streams are defined in
# backend/internal/platform/nats and created by the nats-bootstrap compose job
# and by the worker on start.
server_name: konduite-dev
port: 4222
http_port: 8222
jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 2GB
}
