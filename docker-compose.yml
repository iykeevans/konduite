# Local infrastructure. Postgres + Auth come from the Supabase CLI (`supabase start`).
name: konduite

services:
  nats:
    image: nats:2.11-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./infrastructure/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates or updates the JetStream streams from the same Go
  # definitions the worker uses, so compose and code cannot drift.
  nats-bootstrap:
    image: golang:1.27-alpine
    working_dir: /src/backend
    command: ["go", "run", "./cmd/natsbootstrap"]
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - .:/src:ro
      - go-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      nats:
        condition: service_healthy
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infrastructure/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.8.0
    ports:
      - "16686:16686"

volumes:
  nats-data:
  go-cache:
  go-build-cache:
